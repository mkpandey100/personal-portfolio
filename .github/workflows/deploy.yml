name: Deploy Angular App to GitHub Pages

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: Build project
        run: pnpm run build -- --configuration production --base-href "${{ steps.pages.outputs.base_path }}/"

      - name: Prepare build output
        id: build_output
        run: |
          INDEX_FILE=$(find dist -name "index.html" | head -n 1)
          BUILD_DIR=$(dirname "$INDEX_FILE")
          cp "$BUILD_DIR/index.html" "$BUILD_DIR/404.html"
          echo "dir=$BUILD_DIR" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.build_output.outputs.dir }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
